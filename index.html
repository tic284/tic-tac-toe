<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #eee;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .mode {
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #9fb3d1;
      letter-spacing: 0.5px;
    }

    #status {
      margin-bottom: 20px;
      min-height: 1.4em;
      font-size: 1.1rem;
      color: #b3d4fc;
      text-align: center;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 8px;
    }

    .cell {
      width: 120px;
      height: 120px;
      border: none;
      border-radius: 10px;
      background: #1f3a5f;
      color: #eee;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:hover:not(:disabled) {
      background: #2a4d7a;
      transform: scale(1.03);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.win {
      background: #00b894;
      color: #fff;
    }

    #restart {
      margin-top: 20px;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #restart:hover {
      background: #ff5b7d;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="mode">You: X &nbsp;&nbsp;•&nbsp;&nbsp; Computer: O</div>
  <div id="status">Your turn</div>
  <div id="board"></div>
  <button id="restart">Restart</button>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');

    const HUMAN = 'X';
    const COMPUTER = 'O';

    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const CORNERS = [0, 2, 6, 8];
    const CENTER = 4;

    let cells = Array(9).fill('');
    let gameOver = false;
    let computerThinking = false;

    function render() {
      boardEl.innerHTML = '';
      cells.forEach((value, index) => {
        const button = document.createElement('button');
        button.className = 'cell';
        button.textContent = value;
        button.disabled = value !== '' || gameOver || computerThinking;
        button.addEventListener('click', () => onHumanMove(index));
        boardEl.appendChild(button);
      });
    }

    function onHumanMove(index) {
      if (cells[index] !== '' || gameOver || computerThinking) return;

      cells[index] = HUMAN;

      if (isGameFinished()) return;

      statusEl.textContent = "Computer is thinking...";
      computerThinking = true;
      render();

      setTimeout(() => {
        const move = computerMove();
        cells[move] = COMPUTER;
        computerThinking = false;
        if (isGameFinished()) return;
        statusEl.textContent = "Your turn";
        render();
      }, 500);
    }

    function isGameFinished() {
      const winningLine = findWinningLine();

      if (winningLine) {
        gameOver = true;
        const winner = cells[winningLine[0]];
        statusEl.textContent = winner === HUMAN ? "You win!" : "Computer wins!";
        render();
        document.querySelectorAll('.cell').forEach((cell, i) => {
          if (winningLine.includes(i)) cell.classList.add('win');
        });
        return true;
      }

      if (cells.every(cell => cell !== '')) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        render();
        return true;
      }

      return false;
    }

    function findWinningLine() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          return line;
        }
      }
      return null;
    }

    function emptyIndices() {
      return cells.reduce((acc, cell, i) => (cell === '' ? acc.concat(i) : acc), []);
    }

    function computerMove() {
      const empties = emptyIndices();
      if (empties.length === 0) return null;

      if (Math.random() < 0.3) {
        return empties[Math.floor(Math.random() * empties.length)];
      }

      const winning = findMoveFor(COMPUTER);
      if (winning !== null) return winning;

      const blocking = findMoveFor(HUMAN);
      if (blocking !== null) return blocking;

      if (cells[CENTER] === '') return CENTER;

      const openCorners = CORNERS.filter(i => cells[i] === '');
      if (openCorners.length > 0) {
        return openCorners[Math.floor(Math.random() * openCorners.length)];
      }

      return empties[Math.floor(Math.random() * empties.length)];
    }

    function findMoveFor(player) {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        const values = [cells[a], cells[b], cells[c]];
        if (values.filter(v => v === player).length === 2 && values.includes('')) {
          return line[values.indexOf('')];
        }
      }
      return null;
    }

    restartBtn.addEventListener('click', () => {
      cells = Array(9).fill('');
      gameOver = false;
      computerThinking = false;
      statusEl.textContent = "Your turn";
      render();
    });

    render();
  </script>
</body>
</html>
